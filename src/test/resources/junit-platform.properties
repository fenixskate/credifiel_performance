cucumber.glue=steps,hooks
cucumber.filter.tags=not @pendiente
cucumber.plugin=pretty,html:target/cucumber-report.html,json:target/cucumber-report.json,junit:target/cucumber-report.xml,reports.ScenarioPdfReporter
cucumber.ansi-colors.disabled=true

cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=10